version: 2

models:
  - name: stg_olist__orders
    description: One row per order with lifecycle timestamps.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_olist__customers'), field: customer_id}
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [created, approved, invoiced, processing, shipped, delivered, canceled, unavailable]

  - name: stg_olist__order_items
    description: One row per item line within an order.
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_olist__orders'), field: order_id}
      - name: product_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_olist__products'), field: product_id}
      - name: seller_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_olist__sellers'), field: seller_id}

  - name: stg_olist__payments
    description: One row per payment instalment record.
    columns:
      - name: payment_key
        data_tests: [unique, not_null]
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [credit_card, boleto, voucher, debit_card, not_defined]

  - name: stg_olist__reviews
    description: One row per review per order (deduplicated).
    columns:
      - name: review_key
        data_tests: [unique, not_null]
      - name: review_score
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: stg_olist__customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]

  - name: stg_olist__products
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: stg_olist__sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
